services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evalboard
      POSTGRES_PASSWORD: evalboard
      POSTGRES_DB: evalboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalboard"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://evalboard:evalboard@db:5432/evalboard
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/code

volumes:
  pgdata:
